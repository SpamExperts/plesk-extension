# Codeception Test Suite Configuration
#
# Suite for acceptance tests.
# Perform tests in browser using the WebDriver or PhpBrowser.
# If you need both WebDriver and PHPBrowser tests - create a separate suite.

actor: AcceptanceTester
modules:
    enabled:
        - WebDriver
        - Helper\Acceptance
        - Asserts
    config:
        WebDriver:
         url: 'http://localhost/'
         browser: firefox
         wait: 0
         restart: true
         clear_cookies: true

env:
    # Environment variable names used for spam plugin configuration
    api_url: 'API_URL'
    api_hostname: 'API_HOSTNAME'
    api_username: 'API_USERNAME'
    api_password: 'API_PASSWORD'
    primary_mx: 'PRIMARY_MX'
    secondary_mx: 'SECONDARY_MX'

    # Environment variable names used for the Plesk domain the protection tests run on,
    # and its hosting mail server (defaults to the Plesk host from the panel URL)
    test_domain: 'TEST_DOMAIN'
    hosting_mx: 'HOSTING_MX'

    # Environment variables used for cpanel
    username: 'EXTENSION_USERNAME'
    password: 'EXTENSION_PASSWORD'
    url: 'EXTENSION_URL'

    chrome:
      modules:
        config:
          WebDriver:
            browser: chrome
            capabilities:
              goog:chromeOptions:
                args: ["--headless", "--no-sandbox", "--ignore-certificate-errors", "--window-size=1366,1000"]
    firefox: